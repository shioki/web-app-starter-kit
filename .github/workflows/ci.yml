name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Run shellcheck
        run: |
          shellcheck --version
          shellcheck scripts/*.sh

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: |
            **/*.md

  lychee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Check links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          fail: true
          lycheeVersion: v0.24.2
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 5
            --timeout 20
            "**/*.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bootstrap:
    # 空の Git リポジトリに導入し、配置、validate.sh、再実行の中止を確かめる
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Run integration test
        run: bash scripts/test-bootstrap.sh
